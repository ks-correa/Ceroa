services:
  postgres:
    image: postgres:17-alpine
    container_name: ceroa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ceroa}
      POSTGRES_USER: ${POSTGRES_USER:-ceroa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ceroa_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ceroa_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ceroa} -d ${POSTGRES_DB:-ceroa}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ceroa-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-ceroa}
      DB_USERNAME: ${POSTGRES_USER:-ceroa}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-ceroa_dev}
      SERVER_PORT: 8080
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      SESSION_DAYS: ${SESSION_DAYS:-30}
      SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-false}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
    ports:
      - "${SERVER_PORT:-8080}:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ceroa-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8080/api/v1}
    ports:
      - "3000:3000"

volumes:
  ceroa_postgres_data:
