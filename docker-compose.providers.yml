# Explicit optional Google provider. No sends; calendar writes require backend confirmation.
services:
  workspace-provider:
    image: docker.n8n.io/n8nio/n8n@sha256:ffeb52485f78b1b06c9a832205853cf75da72a07a514c9a27724df85979d6c34
    user: root
    restart: unless-stopped
    entrypoint: [node, /scripts/workspace-provider.mjs]
    environment:
      GOOGLE_PROVIDER_FROM_N8N: 'true'
      WORKSPACE_PROVIDER_DB: /data/provider.sqlite
    volumes:
      - ./integrations/n8n:/scripts:ro
      - ceroa_n8n_data:/home/node/.n8n:ro
      - workspace-provider:/data
    # Access is restricted to the Compose network; no published port.
volumes:
  workspace-provider:
