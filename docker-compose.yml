services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ceroa-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: supabase
      DB_URL: ${DB_URL:?Completa DB_URL de Supabase en .env}
      DB_USERNAME: ${DB_USERNAME:?Completa DB_USERNAME de Supabase en .env}
      DB_PASSWORD: ${DB_PASSWORD:?Completa DB_PASSWORD de Supabase en .env}
      DB_SCHEMA: ${DB_SCHEMA:-ceroa}
      SERVER_PORT: 8080
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      SESSION_DAYS: ${SESSION_DAYS:-30}
      SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-false}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
    ports:
      - "${SERVER_PORT:-8080}:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ceroa-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8080/api/v1}
    ports:
      - "3000:3000"
