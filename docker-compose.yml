services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ceroa-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: supabase
      DB_URL: ${DB_URL:?Completa DB_URL de Supabase en .env}
      DB_USERNAME: ${DB_USERNAME:?Completa DB_USERNAME de Supabase en .env}
      DB_PASSWORD: ${DB_PASSWORD:?Completa DB_PASSWORD de Supabase en .env}
      DB_SCHEMA: ${DB_SCHEMA:-ceroa}
      SERVER_PORT: 8080
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      SESSION_DAYS: ${SESSION_DAYS:-30}
      SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-false}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
    ports:
      - "${SERVER_PORT:-8080}:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ceroa-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8080/api/v1}
    ports:
      - "3000:3000"

  n8n:
    image: docker.n8n.io/n8nio/n8n:stable@sha256:ffeb52485f78b1b06c9a832205853cf75da72a07a514c9a27724df85979d6c34
    container_name: ceroa-n8n
    restart: unless-stopped
    entrypoint: ["tini", "--", "/bin/sh", "/opt/ceroa-workflows/start-n8n.sh"]
    depends_on:
      backend:
        condition: service_started
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_EDITOR_BASE_URL: http://localhost:5678/
      N8N_WEBHOOK_URL: http://localhost:5678/
      N8N_SECURE_COOKIE: "false"
      GENERIC_TIMEZONE: America/Bogota
      TZ: America/Bogota
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: none
      EXECUTIONS_DATA_SAVE_ON_ERROR: none
      EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS: "false"
      EXECUTIONS_DATA_PRUNE: "true"
    volumes:
      - ceroa_n8n_data:/home/node/.n8n
      - ./integrations/n8n:/opt/ceroa-workflows:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5678/healthz/readiness').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s

volumes:
  ceroa_n8n_data:
