server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
  servlet:
    session:
      timeout: 10m
      cookie:
        http-only: true
        secure: ${SESSION_SECURE_COOKIE:false}
        same-site: lax

spring:
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 9MB
      file-size-threshold: 9MB
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:true}
      mail.smtp.starttls.required: ${MAIL_STARTTLS:true}
      mail.smtp.ssl.checkserveridentity: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
      mail.debug: false
  config:
    import: ${CEROA_ENV_FILE:optional:file:../.env[.properties]}
  application:
    name: ceroa-backend
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    baseline-on-migrate: false
    clean-disabled: true
  jackson:
    time-zone: America/Bogota

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.hibernate.orm.jdbc.bind: OFF
    org.hibernate.SQL: OFF

ceroa:
  sentinel:
    enabled: ${SENTINEL_ENABLED:false}
    worker-key: ${SENTINEL_WORKER_KEY:}
  reminders:
    enabled: ${REMINDERS_ENABLED:false}
    worker-key: ${REMINDERS_WORKER_KEY:}
  rag:
    enabled: ${RAG_ENABLED:false}
    db-url: ${RAG_DB_URL:}
    db-username: ${RAG_DB_USERNAME:}
    db-password: ${RAG_DB_PASSWORD:}
    embedding-webhook-url: ${RAG_EMBEDDING_WEBHOOK_URL:}
    worker-key: ${RAG_WORKER_KEY:}
  documents:
    enabled: ${DOCUMENTS_ENABLED:false}
    webhook-url: ${DOCUMENTS_WEBHOOK_URL:}
    worker-key: ${DOCUMENTS_WORKER_KEY:}
  assistant:
    enabled: ${ASSISTANT_ENABLED:false}
    webhook-url: ${ASSISTANT_WEBHOOK_URL:}
    worker-key: ${ASSISTANT_WORKER_KEY:}
  plus:
    monthly-price: ${PLUS_MONTHLY_PRICE:}
    yearly-price: ${PLUS_YEARLY_PRICE:}
    currency: ${PLUS_CURRENCY:COP}
  mercado-pago:
    access-token: ${MP_ACCESS_TOKEN:}
    webhook-secret: ${MP_WEBHOOK_SECRET:}
  recovery:
    mail-from: ${MAIL_FROM:}
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  session:
    days: ${SESSION_DAYS:30}
    secure-cookie: ${SESSION_SECURE_COOKIE:false}
