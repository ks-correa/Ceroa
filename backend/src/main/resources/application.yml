server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
  servlet:
    session:
      timeout: 10m
      cookie:
        http-only: true
        secure: ${SESSION_SECURE_COOKIE:false}
        same-site: lax

spring:
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:true}
      mail.smtp.starttls.required: ${MAIL_STARTTLS:true}
      mail.smtp.ssl.checkserveridentity: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
      mail.debug: false
  config:
    import: optional:file:../.env[.properties]
  application:
    name: ceroa-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ceroa}
    username: ${DB_USERNAME:ceroa}
    password: ${DB_PASSWORD:ceroa_dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: America/Bogota

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.hibernate.orm.jdbc.bind: OFF
    org.hibernate.SQL: OFF

ceroa:
  recovery:
    mail-from: ${MAIL_FROM:}
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  session:
    days: ${SESSION_DAYS:30}
    secure-cookie: ${SESSION_SECURE_COOKIE:false}
