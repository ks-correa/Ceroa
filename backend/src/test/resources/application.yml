spring:
  datasource:
    url: jdbc:h2:mem:ceroa;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop

ceroa:
  frontend-url: http://localhost:3000
  session:
    days: 30
    secure-cookie: false
