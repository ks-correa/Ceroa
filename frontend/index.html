<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ceroa - Gestión de Deudas y Libertad Financiera</title>
    <meta name="description" content="Plataforma de finanzas personales para proyectar y eliminar deudas con métodos Bola de Nieve y Avalancha, simulador de escenarios y calendario de vencimientos." />
    <meta property="og:title" content="Ceroa - Gestión de Deudas" />
    <meta property="og:description" content="Optimiza tus finanzas personales y sal de deudas en tiempo récord con Ceroa." />
    <meta property="og:type" content="website" />
    <meta name="color-scheme" content="light dark" />
    <script>
      try {
        const preferences = JSON.parse(localStorage.getItem('ceroa_preferences') || '{}');
        if (preferences.darkMode === true) {
          document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = 'dark';
        }
      } catch (_) {
        // Invalid or unavailable storage falls back to the light theme.
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      }
    </style>
  </head>
  <body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 antialiased selection:bg-teal-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
